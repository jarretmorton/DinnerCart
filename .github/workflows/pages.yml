name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/stamp-site.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      # Fresh URLs per deploy so browsers never mix cached old JS with new HTML.
      - run: node scripts/stamp-site.mjs web _site "${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
