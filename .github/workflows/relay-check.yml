name: Relay check

# Run by hand (Actions → Relay check → Run workflow) when the app can't reach
# the relay. Calls the routes Check setup uses, the way the phone does (with
# this site's Origin), and prints each answer's status, its CORS header and,
# for errors, the first part of the reply. A browser hides all of that behind
# "Failed to fetch"; this shows it. Then tries the app's direct search to
# Kroger (from GitHub's servers, so a firewall may treat it differently than
# a phone). Never prints the password or a token
# (the repository and its logs may be public).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RELAY_PASSWORD: ${{ secrets.RELAY_PASSWORD }}
      RELAY_URL: ${{ vars.RELAY_URL }}
      ORIGIN: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Call the relay
        run: |
          node --input-type=module <<'EOF'
          const base = process.env.RELAY_URL.replace(/\/+$/, '');
          const headers = { origin: process.env.ORIGIN, 'x-relay-password': process.env.RELAY_PASSWORD };
          let failed = false;
          async function call(method, path, body) {
            const started = Date.now();
            try {
              const res = await fetch(`${base}${path}`, {
                method,
                headers: { ...headers, ...(body ? { 'content-type': 'application/json' } : {}) },
                body: body ? JSON.stringify(body) : undefined,
                signal: AbortSignal.timeout(60_000),
              });
              const text = await res.text();
              const cors = res.headers.get('access-control-allow-origin') || 'MISSING';
              let shape = '';
              try {
                const data = JSON.parse(text);
                shape = res.ok ? `keys: ${Object.keys(data).join(', ')}` : `error: ${JSON.stringify(data.error || data).slice(0, 300)}`;
                // Product search reports a failed term inside a 200.
                if (res.ok && data.errors && Object.keys(data.errors).length) {
                  failed = true;
                  shape += ` · errors: ${JSON.stringify(data.errors).slice(0, 300)}`;
                }
                if (res.ok && data.results) shape += ` · ${Object.values(data.results).map((r) => r.length).join('/')} results`;
              } catch {
                shape = `not JSON (${res.headers.get('content-type')}): ${text.replace(/\s+/g, ' ').slice(0, 300)}`;
              }
              if (!res.ok || cors === 'MISSING') failed = true;
              console.log(`${method} ${path} -> ${res.status} in ${Date.now() - started} ms · CORS ${cors} · ${shape}`);
              return res.ok ? JSON.parse(text) : null;
            } catch (err) {
              failed = true;
              console.log(`${method} ${path} -> no answer after ${Date.now() - started} ms: ${err.message}`);
              return null;
            }
          }
          // The CORS preflight a browser sends before each call.
          async function preflight(method, path) {
            try {
              const res = await fetch(`${base}${path}`, { method: 'OPTIONS', headers: { origin: process.env.ORIGIN, 'access-control-request-method': method, 'access-control-request-headers': 'x-relay-password,content-type' }, signal: AbortSignal.timeout(30_000) });
              const allow = res.headers.get('access-control-allow-origin') || 'MISSING';
              if (!res.ok || allow === 'MISSING') failed = true;
              console.log(`OPTIONS ${path} (for ${method}) -> ${res.status} · CORS ${allow} · allows headers: ${res.headers.get('access-control-allow-headers') || 'none'}`);
            } catch (err) {
              failed = true;
              console.log(`OPTIONS ${path} -> no answer: ${err.message}`);
            }
          }
          for (const [m, p] of [['GET', '/health'], ['GET', '/kroger/token'], ['POST', '/kroger/products']]) await preflight(m, p);
          await call('GET', '/health');
          const prefs = await call('GET', '/prefs');
          const key = await call('GET', '/kroger/token');
          const locationId = prefs?.prefs?.store?.locationId;
          await call('POST', '/kroger/products', { terms: ['milk'], locationId });
          // The app's direct search: the phone asks Kroger itself, with the
          // search key in the address (see web/js/kroger.js). A browser can
          // only read the answer if Kroger sends a CORS header for this site.
          // For information only: the app falls back to the relay.
          async function direct(label, { ua, header = false }) {
            const params = new URLSearchParams({ 'filter.term': 'milk', 'filter.limit': '12' });
            if (locationId) params.set('filter.locationId', locationId);
            if (!header) params.set('access_token', key.access_token);
            try {
              const res = await fetch(`https://api.kroger.com/v1/products?${params}`, {
                headers: {
                  origin: process.env.ORIGIN,
                  accept: 'application/json',
                  ...(ua ? { 'user-agent': ua } : {}),
                  ...(header ? { authorization: `Bearer ${key.access_token}` } : {}),
                },
                signal: AbortSignal.timeout(30_000),
              });
              const text = await res.text();
              const type = res.headers.get('content-type') || '?';
              let shape;
              try {
                const data = JSON.parse(text);
                shape = res.ok ? `${(data.data || []).length} results` : `error: ${JSON.stringify(data).slice(0, 200)}`;
              } catch {
                shape = text.match(/<title>([^<]*)<\/title>/i)?.[1]?.trim() || text.replace(/\s+/g, ' ').slice(0, 200);
              }
              console.log(`Kroger direct, ${label} -> ${res.status} · CORS ${res.headers.get('access-control-allow-origin') || 'MISSING'} · ${type} · ${shape}`);
            } catch (err) {
              console.log(`Kroger direct, ${label} -> no answer: ${err.message}`);
            }
          }
          if (key?.access_token) {
            const CHROME = 'Mozilla/5.0 (Linux; Android 14; SM-S921U) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Mobile Safari/537.36';
            await direct('as a phone browser (key in the address)', { ua: CHROME });
            await direct('no browser name (key in the address)', {});
            await direct('as a phone browser (key in a header)', { ua: CHROME, header: true });
          }
          process.exit(failed ? 1 : 0);
          EOF
