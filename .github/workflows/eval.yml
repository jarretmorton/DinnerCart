name: Resolver eval

# Scores ingredient -> product matching on eval/cases.json whenever the
# resolver changes on main (not on working branches too, which would run it
# twice per change). Skips quietly until GEMINI_API_KEY, RELAY_PASSWORD and
# the RELAY_URL variable are set.
#
# Automatic runs use the light model: each run takes about 7 Gemini
# requests, and the free tier's daily limit is counted per model, so this
# leaves the strong model's small allowance to the app. To score the strong
# model, run it by hand (Actions → Resolver eval → Run workflow).
on:
  push:
    branches: [main]
    paths: ["web/js/resolver.js", "web/js/units.js", "web/js/gemini.js", "eval/**"]
  workflow_dispatch:
    inputs:
      model:
        description: Gemini model to score
        type: choice
        options: [gemini-flash-lite-latest, gemini-flash-latest]
        default: gemini-flash-lite-latest

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RELAY_PASSWORD: ${{ secrets.RELAY_PASSWORD }}
      RELAY_URL: ${{ vars.RELAY_URL }}
      # inputs is empty on push, so pushes get the light model.
      GEMINI_MODEL: ${{ inputs.model || 'gemini-flash-lite-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check configuration
        id: cfg
        run: |
          if [ -n "$GEMINI_API_KEY" ] && [ -n "$RELAY_PASSWORD" ] && [ -n "$RELAY_URL" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Eval skipped: set GEMINI_API_KEY and RELAY_PASSWORD secrets and the RELAY_URL variable."; fi
      - uses: actions/cache@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          path: eval/.cache
          key: eval-products-${{ hashFiles('eval/cases.json') }}
      - name: Run eval
        if: steps.cfg.outputs.ready == 'true'
        # pipefail: without it the step takes tee's exit code and a crashed
        # eval (e.g. Gemini's daily limit) still shows as passed.
        run: |
          set -o pipefail
          node eval/run.mjs 2>&1 | tee eval-output.txt
      # Summary and results even when the eval failed, so the error shows on the run's page.
      - name: Summary
        if: always() && steps.cfg.outputs.ready == 'true'
        run: |
          { echo '```'; cat eval-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.cfg.outputs.ready == 'true'
        with:
          name: eval-results
          path: eval/results/latest.json
